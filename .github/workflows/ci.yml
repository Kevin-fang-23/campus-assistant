name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # 支持手动触发，便于排查

# 同一分支连续推送时取消上一次未跑完的任务，避免 runner 排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      # 静态检查：E/F/W 级别（ruff.toml 已排除 E501 行长）。
      # F821（未定义符号）能在 CI 阶段拦住 P0-1 那类「引用了从未定义的名字」
      # 的缺陷 —— 那类分支只有异常路径才执行，单测很难覆盖到。
      - name: 静态检查（ruff）
        run: ruff check app tests eval scripts

      # 不注入任何密钥，也不设置 provider 变量：
      # tests/conftest.py 自身会把 VLM/QA 固定为 mock、OCR 固定为 stub，
      # embedding 在无 Key 时自动回退本地哈希 —— 测试本就不该依赖外网。
      # 若这里为了"让它过"而注入密钥，就等于默认了测试需要外部服务，是退步。
      - name: 运行测试
        run: pytest -q --no-header

      # 检索质量门禁：把指标与 eval/baseline.json 比对，低于「基线 - 容差」即失败。
      #
      # 为什么单测不够：单测覆盖的是结构与边界（分词是否可逆、融合是否归一化），
      # 而"检索变差了"是**静默**的 —— 改了分词/权重后 MRR 从 0.96 掉到 0.80，
      # 所有单测照样全绿，直到用户抱怨"搜不到了"才被发现。
      #
      # 用 local_hash 而非 dashscope：前者确定性、离线、毫秒级，适合当基准；
      # 后者受服务端状态影响会波动，卡门禁只会带来假红。
      # CI 无 Key，embedding_provider=auto 自然落到 local_hash，与此一致。
      - name: 检索质量门禁
        run: python -m eval.run_retrieval_eval --embedding local_hash --gate

      # 缓存语义阈值的门禁：只守一条**安全不变量** —— 配置的阈值在标注集上
      # 不得把「相近但异义」的问法判成命中（那会让用户拿到另一个问题的答案，
      # 且被缓存在 TTL 内放大）。不去卡命中率：那是收益，会随语料/后端波动，
      # 卡死只会带来假红。
      #
      # 用 local_hash：离线、确定性、毫秒级，CI 无 Key 时正是该后端。
      # 注意这里不校验阈值是否"最优" —— 最优值依赖 dashscope 的向量分布，
      # 只能在有 Key 的环境人工重跑标定（见 eval/CACHE_SEMANTIC_BASELINE.md）。
      - name: 缓存语义阈值门禁
        run: python -m eval.run_cache_threshold_eval --embedding local_hash --gate

  frontend:
    name: 前端测试、类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS：vite 8 要求 ^20.19 || >=22.12，vitest 4 支持 20/22/24，
          # 取 22 可同时满足两者，避免贴着下限跑。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 运行测试
        run: npm run test

      - name: 构建
        run: npm run build
