name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # 支持手动触发，便于排查

# 同一分支连续推送时取消上一次未跑完的任务，避免 runner 排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: 安装依赖
        run: pip install -r requirements-ci.txt

      # 不注入任何密钥，也不设置 provider 变量：
      # tests/conftest.py 自身会把 VLM/QA 固定为 mock、OCR 固定为 stub，
      # embedding 在无 Key 时自动回退本地哈希 —— 测试本就不该依赖外网。
      # 若这里为了"让它过"而注入密钥，就等于默认了测试需要外部服务，是退步。
      - name: 运行测试
        run: pytest -q --no-header

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # 单独跑一次 tsc：npm run build 里也有 tsc，但混在构建输出里
      # 不容易看出是类型错误还是打包错误，这里让失败原因更直白。
      - name: 类型检查
        run: npx tsc --noEmit

      - name: 构建
        run: npm run build
