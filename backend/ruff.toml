# 静态检查配置。
#
# 规则集选择（有意保守起步）：
# - E/F/W：pycodestyle 错误 + pyflakes —— 能拦住「未定义符号（F821）」
#   「未使用导入（F401）」「未使用变量（F841）」这类真实缺陷。
#   P0-1（rate_limit._release 引用未定义的 logger）正是 F821 能在
#   编码阶段拦下的缺陷，当时因为没有静态检查而漏到了线上。
# - E501（行过长）被忽略：既有代码里有大量带中文说明的长行（docstring、
#   表格注释），为过线而重排会制造与缺陷无关的 diff 噪声。中文注释
#   按字符计宽，88 列限制对它本就过紧。
#
# 代码里大量 `# noqa: BLE001` / `ANN001` 注释依赖 BLE / ANN 规则集，
# 暂未启用（一次放开会引入上百条历史告警）。待逐步补齐类型注解后
# 再考虑放开，届时这些 noqa 会自然生效。
target-version = "py311"

[lint]
select = ["E", "F", "W"]
ignore = ["E501"]
