# 静态检查配置。
#
# 规则集演进（两阶段）：
#   1. 基础版（E/F/W）：拦住「未定义符号（F821）」「未使用导入（F401）」
#      「未使用变量（F841）」这类真实缺陷。P0-1（rate_limit._release 引用
#      未定义的 logger）正是 F821 能在编码阶段拦下的缺陷。
#   2. 本版扩展：
#      · BLE   —— 盲捕获异常（except Exception）。历史上 60 处
#        `# noqa: BLE001` 是装饰性注释（规则未启用、noqa 无效）；启用后
#        这些注释真正生效：每一处盲捕获都被显式标记为"已审查"，
#        而新增的未标记盲捕获会被 CI 拦下。
#      · RUF100 —— 无效 noqa。与 BLE 配套：noqa 引用了未启用规则的注释
#        会被清除，杜绝"两边的意图都没实现"的最差状态。
#      · I / UP / B / SIM —— 导入排序、pyupgrade（现代语法）、bugbear
#        （常见 bug 模式，如 zip 缺 strict）、化简嵌套。
#
# 豁免说明：
#   · E501（行过长）：既有代码有大量中文说明长行（docstring、表格注释），
#     为过线重排会制造与缺陷无关的 diff 噪声；中文按字符计宽，88 列过紧。
#   · B008（函数调用作默认参数）：FastAPI 的 Depends()/File()/Query()
#     惯用法，误报。
#   · ANN（类型注解）仍未启用：全量补齐注解是一次独立的大改动，
#     与静态检查规则的接入解耦；原装饰性 `# noqa: ANNxxx` 已被 RUF100
#     清除，待补齐注解后再启用并重新审查。
target-version = "py311"

[lint]
select = ["E", "F", "W", "BLE", "RUF100", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
